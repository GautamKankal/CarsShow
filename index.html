<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cars.com</title>
    <style>
        body{
            background-color: blueviolet;
            margin: 0;
        }
        .F1{
            width: 50vw;
            height: 50vh;
        }
        #Main_Img{
            margin: 0;
            width: 100vw;
            height: 100vh;
            background-size: cover;
            background-position: center;
            position:absolute ;
            top: 0vh;
            left:0vw;
        }
        .F2{
            position: absolute;
            right: 50px;
            top:30px;
        }
        .F2 img{
            width: 150px;
        }
        .F3{
            position: absolute;
            left: 50px;
            top:30px;
            font-size:xx-large;
        }
        .F4{
            position:absolute;
            font-size: x-large;
            left: 50px;
            bottom: 100px;
            color: black;

        }
        .F4 td{
            padding-bottom:40px;
            transition: all 0.5s ease-in-out;
        }
        .F4 td:hover{
            padding-left:30px;
        }
    </style>
</head>
<body>
    <div class="Main">
        <div class="F1">
            <img src="https://images7.alphacoders.com/130/thumb-1920-1306048.jpg" alt="" id="Main_Img">

        </div>
        <div class="F2">
            <img src="https://images.seeklogo.com/logo-png/2/2/bugatti-eb-logo-png_seeklogo-23379.png" alt="">
        </div>
        <div class="F3">
            <h1>BUGATTI</h1>
        </div>
        <div class="F4">
            <table>
                <tr>
                    <td>HOME</td>
                </tr>
                <tr>
                    <td>Booking</td>
                </tr>
                <tr>
                    <td>Models</td>
                </tr>
                <tr>
                    <td>About</td>
                </tr>
            </table>

        </div>


    </div>
    
</body>
</html>
